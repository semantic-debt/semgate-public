name: Gemini v2 foundation

# Manual only: these tests are part of the full suite in ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']  # requires-python >=3.10
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (released 2026-07-20)
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (released 2025-04-24)
        with:
          python-version: ${{ matrix.python }}
      - name: Install core and tests only (no model SDK or API credentials)
        run: python -m pip install -e ".[dev]"
      - name: Foundation contract and real-engine tests
        run: python -m pytest tests/test_gemini_foundation.py tests/test_gemini_foundation_integration.py -q
      - name: Existing complete Linux suite
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m pytest tests/ --ignore=tests/tests -q
